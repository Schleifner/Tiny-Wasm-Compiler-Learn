name: Checkers

on:
  pull_request:
    branches:
      - main

jobs:
  cspell:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'

    - name: Install cspell
      run: npm install -g cspell prettier

    - name: Run cspell
      run: cspell "**/*.md"

    - name: Check format
      run: prettier --check "**/*.md"
